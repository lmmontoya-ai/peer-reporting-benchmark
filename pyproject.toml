[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "swarm-auth-bench"
version = "0.1.0"
description = "Controlled experiments on authorization in autonomous agent populations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
analysis = ["matplotlib>=3.10,<4"]

[project.scripts]
swarm-auth = "swarm_auth_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_auth_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the provisioned Linux VM and real gVisor",
  "live: requires authenticated Codex and performs actual model calls",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
